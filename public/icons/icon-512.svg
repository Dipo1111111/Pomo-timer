<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Warm cream rounded square background -->
  <rect width="512" height="512" rx="100" fill="#F2EDE4"/>
  <!-- Track ring (subtle) -->
  <circle cx="256" cy="256" r="165" stroke="#632228" stroke-width="18" fill="none" opacity="0.12"/>
  <!-- Progress ring (~75%) -->
  <circle cx="256" cy="256" r="165" stroke="#632228" stroke-width="18" fill="none"
    stroke-dasharray="1036.7" stroke-dashoffset="259.2" stroke-linecap="round"
    transform="rotate(-90 256 256)"/>
  <!-- Center anchor dot -->
  <circle cx="256" cy="256" r="10" fill="#632228" opacity="0.3"/>
  <!-- "25" in serif (Editorial theme) -->
  <text x="256" y="287" text-anchor="middle" fill="#632228"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96" font-weight="700">25</text>
</svg>
