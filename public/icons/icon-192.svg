<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Warm cream rounded square background -->
  <rect width="192" height="192" rx="40" fill="#F2EDE4"/>
  <!-- Track ring (subtle) -->
  <circle cx="96" cy="96" r="60" stroke="#632228" stroke-width="7" fill="none" opacity="0.12"/>
  <!-- Progress ring (~75%) -->
  <circle cx="96" cy="96" r="60" stroke="#632228" stroke-width="7" fill="none"
    stroke-dasharray="377.0" stroke-dashoffset="94.2" stroke-linecap="round"
    transform="rotate(-90 96 96)"/>
  <!-- Center anchor dot -->
  <circle cx="96" cy="96" r="3.5" fill="#632228" opacity="0.3"/>
  <!-- "25" in serif (Editorial theme) -->
  <text x="96" y="107" text-anchor="middle" fill="#632228"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34" font-weight="700">25</text>
</svg>
