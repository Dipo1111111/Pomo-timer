<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Warm cream rounded square -->
  <rect width="64" height="64" rx="14" fill="#F2EDE4"/>
  <!-- Track ring (subtle) -->
  <circle cx="32" cy="32" r="22" stroke="#632228" stroke-width="4.5" fill="none" opacity="0.12"/>
  <!-- Progress ring (~75%) -->
  <circle cx="32" cy="32" r="22" stroke="#632228" stroke-width="4.5" fill="none"
    stroke-dasharray="138.2" stroke-dashoffset="34.6" stroke-linecap="round"
    transform="rotate(-90 32 32)"/>
  <!-- Center anchor -->
  <circle cx="32" cy="32" r="2.5" fill="#632228" opacity="0.35"/>
  <!-- "25" in serif -->
  <text x="32" y="37" text-anchor="middle" fill="#632228"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14" font-weight="700">25</text>
</svg>
