<!doctype html>
<html lang="en" data-visual-theme="editorial">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A beautiful, minimalist Pomodoro timer for focused work sessions — works offline as a PWA." />

    <!-- Theme color (matches Editorial warm ivory / oxblood) -->
    <meta name="theme-color" content="#F2EDE4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2D1818" media="(prefers-color-scheme: dark)" />

    <!-- PWA: Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- PWA: iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pomodoro" />

    <!-- PWA: Windows -->
    <meta name="msapplication-TileColor" content="#632228" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.svg" />

    <!-- Favicon (SVG — supported in all modern browsers) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Safari pinned tab -->
    <link rel="mask-icon" href="/favicon.svg" color="#6b7aff" />

    <!-- iOS home screen icon -->
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />

    <!-- Prevent theme flash: restore saved theme before first paint -->
    <script>
      (function(){
        try {
          var saved = JSON.parse(localStorage.getItem('pomodoro:settings'));
          if (saved && saved.visualTheme) {
            document.documentElement.setAttribute('data-visual-theme', saved.visualTheme);
          }
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=Inter+Tight:wght@300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=Syne:wght@400..800&family=Space+Grotesk:wght@400..700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />

    <title>Pomodoro Timer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
